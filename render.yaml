services:
  - type: web
    name: azestetik-platform
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: azestetik-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: azestetik-db
    databaseName: azestetik
    user: azestetik
