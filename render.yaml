services:
  - type: web
    name: azestetik-platform
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: azestetik-db
          property: connectionString

databases:
  - name: azestetik-db
    databaseName: azestetik
    user: azestetik
    plan: free
