<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AzEstetik - Tənzimləmələr</title>
    <link rel="stylesheet" href="ambassador_style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="ambassador_dashboard.html" class="brand">
                <div class="brand-icon">Az</div>
                <span class="brand-name">AzEstetik</span>
            </a>
            <nav>
                <ul class="nav-list">
                    <li><a href="ambassador_dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                    <li><a href="ambassador_network.html" class="nav-link"><i data-lucide="users-2"></i> Şəbəkəm</a></li>
                    <li><a href="ambassador_bonuses.html" class="nav-link"><i data-lucide="coins"></i> Bonuslar</a></li>
                    <li><a href="ambassador_customers.html" class="nav-link"><i data-lucide="user-plus"></i> Müştərilər</a></li>
                    <li><a href="ambassador_marketing.html" class="nav-link"><i data-lucide="file-text"></i> Materiallar</a></li>
                    <li><a href="ambassador_academy.html" class="nav-link"><i data-lucide="graduation-cap"></i> Akademiya</a></li>
                    <li><a href="ambassador_analytics.html" class="nav-link"><i data-lucide="bar-chart-3"></i> Analitika</a></li>
                    <li><a href="ambassador_leaderboard.html" class="nav-link"><i data-lucide="trophy"></i> Liderlər</a></li>
                    <li><a href="ambassador_events.html" class="nav-link"><i data-lucide="calendar"></i> Tədbirlər</a></li>
                    <li><a href="ambassador_support.html" class="nav-link"><i data-lucide="headphones"></i> Dəstək</a></li>
                    <li><a href="ambassador_settings.html" class="nav-link active"><i data-lucide="settings"></i> Tənzimləmələr</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <header class="header">
                <div class="header-title">
                    <h1>Tənzimləmələr</h1>
                    <p>Profil məlumatlarınızı və təhlükəsizlik seçimlərinizi idarə edin.</p>
                </div>
            </header>

            <div class="modern-card" style="max-width: 600px;">
                <div style="display: flex; gap: 24px; align-items: center; margin-bottom: 32px;">
                    <div style="width: 80px; height: 80px; border-radius: 20px; background: var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800;">AM</div>
                    <div>
                        <h3 style="margin-bottom: 4px;">Aysel Məmmədova</h3>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Premium Ambassador</p>
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 20px;">
                    <div>
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted);">AD SOYAD</label>
                        <input type="text" value="Aysel Məmmədova" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 10px; color: white; font-weight: 500;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: var(--text-muted);">E-POÇT</label>
                        <input type="email" value="aysel@azestetik.az" style="width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); padding: 12px 16px; border-radius: 10px; color: white; font-weight: 500;">
                    </div>
                </div>
                
                <button class="btn-modern" style="margin-top: 40px;">Dəyişiklikləri Saxla</button>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
