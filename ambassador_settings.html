<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

</head>
<body class="animate-entrance">
    <div class="app-wrapper">
        <aside class="sidebar" id="sidebar">
            <div class="logo-container">
                <div class="logo-box">Az</div>
                <div style="font-weight:700; font-size:1.25rem;">AzEstetik</div>
            </div>
            <nav class="nav-group">
                <a href="ambassador_dashboard.html" class="nav-item "><span class="nav-icon">📊</span> Dashboard</a>
                <a href="ambassador_network.html" class="nav-item "><span class="nav-icon">👥</span> Şəbəkəm</a>
                <a href="ambassador_bonuses.html" class="nav-item "><span class="nav-icon">💰</span> Bonuslar</a>
                <a href="ambassador_customers.html" class="nav-item "><span class="nav-icon">🤝</span> Müştərilər</a>
                <a href="ambassador_marketing.html" class="nav-item "><span class="nav-icon">📢</span> Materiallar</a>
                <a href="ambassador_academy.html" class="nav-item "><span class="nav-icon">🎓</span> Akademiya</a>
                <a href="ambassador_analytics.html" class="nav-item "><span class="nav-icon">📈</span> Analitika</a>
                <a href="ambassador_leaderboard.html" class="nav-item "><span class="nav-icon">🏆</span> Liderlər</a>
                <a href="ambassador_events.html" class="nav-item "><span class="nav-icon">📅</span> Tədbirlər</a>
                <a href="ambassador_support.html" class="nav-item "><span class="nav-icon">💬</span> Dəstək</a>
                <a href="ambassador_settings.html" class="nav-item active"><span class="nav-icon">⚙️</span> Tənzimləmələr</a>
            </nav>
            <div style="margin-top:auto; padding-top:20px;">
                <button class="btn btn-secondary" style="width:100%; justify-content:flex-start;" onclick="toggleTheme()">
                    <span id="theme-icon">🌙</span> Dark Mode
                </button>
            </div>
        </aside>
        <main class="main">
            <header class="header">
                <div><h1 style="margin:0;">Tənzimləmələr</h1><p style="color:var(--text-muted); font-size:0.875rem; margin-top:4px;">Hesab və profil parametrləriniz.</p></div>
                <div style="display:flex; gap:12px; align-items:center;">
                    <div class="lang-selector">
                        <button onclick="changeLang('az')" class="lang-pill" id="btn-az"><img src="https://flagcdn.com/w40/az.png"> AZ</button>
                        <button onclick="changeLang('en')" class="lang-pill" id="btn-en"><img src="https://flagcdn.com/w40/gb.png"> EN</button>
                        <button onclick="changeLang('ru')" class="lang-pill" id="btn-ru"><img src="https://flagcdn.com/w40/ru.png"> RU</button>
                    </div>
                    <div style="width:40px; height:40px; border-radius:50%; background:#E2E8F0; display:flex; align-items:center; justify-content:center; font-weight:600;">AM</div>
                </div>
            </header>
            <div class="grid grid-cols-2">
    <div class="card">
        <div class="card-header"><div class="card-title">Şəxsi Məlumatlar</div></div>
        <div style="display:flex; flex-direction:column; gap:16px;">
            <div><label style="font-size:0.85rem; font-weight:500; color:var(--text-muted); display:block; margin-bottom:6px;">Ad Soyad</label><input type="text" value="Ali Mammadov" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:0.9rem; background:var(--bg);"></div>
            <div><label style="font-size:0.85rem; font-weight:500; color:var(--text-muted); display:block; margin-bottom:6px;">E-poçt</label><input type="email" value="ali@azestetik.az" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:0.9rem; background:var(--bg);"></div>
            <div><label style="font-size:0.85rem; font-weight:500; color:var(--text-muted); display:block; margin-bottom:6px;">Telefon</label><input type="tel" value="+994 50 123 45 67" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:0.9rem; background:var(--bg);"></div>
            <button class="btn btn-primary" style="width:100%;">Yadda Saxla</button>
        </div>
    </div>
    <div class="card">
        <div class="card-header"><div class="card-title">Təhlükəsizlik</div></div>
        <div style="display:flex; flex-direction:column; gap:16px;">
            <div><label style="font-size:0.85rem; font-weight:500; color:var(--text-muted); display:block; margin-bottom:6px;">Cari Şifrə</label><input type="password" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:0.9rem; background:var(--bg);"></div>
            <div><label style="font-size:0.85rem; font-weight:500; color:var(--text-muted); display:block; margin-bottom:6px;">Yeni Şifrə</label><input type="password" style="width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:0.9rem; background:var(--bg);"></div>
            <button class="btn btn-secondary" style="width:100%;">Şifrəni Dəyiş</button>
        </div>
        <hr style="margin:24px 0; border:0; border-top:1px solid var(--border);">
        <div class="card-header"><div class="card-title">Bildirişlər</div></div>
        <div style="display:flex; flex-direction:column; gap:12px; margin-top:12px;">
            <label style="display:flex; align-items:center; gap:10px; font-size:0.9rem; cursor:pointer;"><input type="checkbox" checked> E-poçt bildirişləri</label>
            <label style="display:flex; align-items:center; gap:10px; font-size:0.9rem; cursor:pointer;"><input type="checkbox" checked> SMS bildirişlər</label>
            <label style="display:flex; align-items:center; gap:10px; font-size:0.9rem; cursor:pointer;"><input type="checkbox"> Push bildirişlər</label>
        </div>
    </div>
</div>
        </main>
    </div>
    <nav class="mobile-nav">
        <a href="ambassador_dashboard.html" class="bottom-nav-item "><span>🏠</span></a>
        <a href="ambassador_network.html" class="bottom-nav-item "><span>👥</span></a>
        <a href="ambassador_academy.html" class="bottom-nav-item "><span>🎓</span></a>
        <a href="ambassador_settings.html" class="bottom-nav-item active"><span>⚙️</span></a>
    </nav>
    <div id="google_translate_element" style="display:none;"></div>
    <script>
        function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'az',includedLanguages:'en,ru,az',layout:google.translate.TranslateElement.InlineLayout.SIMPLE,autoDisplay:false},'google_translate_element');}
        function changeLang(l){localStorage.setItem('selected_lang',l);document.cookie=l==='az'?"googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;":"googtrans=/az/"+l+"; path=/";window.location.reload();}
        function toggleTheme(){document.body.classList.toggle('dark-theme');var d=document.body.classList.contains('dark-theme');localStorage.setItem('theme',d?'dark':'light');document.getElementById('theme-icon').innerText=d?'☀️':'🌙';}
        document.addEventListener("DOMContentLoaded",()=>{if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark-theme');document.getElementById('theme-icon').innerText='☀️';}var l=localStorage.getItem('selected_lang')||'az';document.querySelectorAll('.lang-pill').forEach(b=>b.classList.remove('active'));if(document.getElementById('btn-'+l))document.getElementById('btn-'+l).classList.add('active');});
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
